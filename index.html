async function shrink(file, max, q) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const sc = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(res, 'image/jpeg', q));
  } finally { URL.revokeObjectURL(url); }
}
function friendly(e, who) {
  const m = (e && e.message) || String(e);
  if (/invalid login/i.test(m)) return new Error(who === 'staff' ? 'Wrong email or password.' : 'Wrong phone number or password.');
  if (/already (been )?registered|already exists/i.test(m)) return new Error(who === 'staff' ? 'That email is already set up — sign in instead.' : 'That number already has an account — sign in instead.');
  if (/password should be|at least 6/i.test(m)) return new Error('Password needs at least 6 characters.');
  if (/email not confirmed/i.test(m)) return new Error('Sign-in is blocked: turn off “Confirm email” in Supabase (see setup guide).');
  if (/rate limit|too many/i.test(m)) return new Error('Too many tries — wait a minute and try again.');
  return new Error(m);
}

async function refreshUser() {
  const jobs = [
    api.notifications().then(n => { S.notifs = n || []; }),
    api.listIdeas().then(x => { S.ideas = x || []; })
  ];
  if (S.user) jobs.push(api.myOrders(S.user.id).then(x => { S.myOrders = x || []; })); else S.myOrders = [];
  if (isStaff()) jobs.push(
    api.allOrders().then(x => { S.allOrders = x || []; }),

    api.customerCount().then(x => { S.customerCount = x; })
  ); else S.allOrders = [];
  await Promise.all(jobs.map(p => p.catch(e => console.warn(e))));
  // new-order alerts for owners
  if (isStaff()) {
    if (knownOrders) S.allOrders.filter(o => o.status === 'new' && !knownOrders.has(o.id)).slice(0, 3).forEach(alertNewOrder);
    knownOrders = new Set(S.allOrders.map(o => o.id));

function chime() {
  if (!actx) return;
  const t0 = actx.currentTime;
  [880, 1175, 1568].forEach((f, i) => {
    const o = actx.createOscillator(), g = actx.createGain(), d = i * 0.17;
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t0 + d); g.gain.exponentialRampToValueAtTime(0.35, t0 + d + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.16);
    o.connect(g); g.connect(actx.destination); o.start(t0 + d); o.stop(t0 + d + 0.18);
  });
}

  toast((o.kind === 'catering' ? 'New catering request — ' : 'New order — ') + o.name, { label: 'View', a: 'tab', v: 'owner' });

function localNotify(n) {

async function enablePush() {
  if (api.demo) return toast('Alerts turn on once the app is connected to the database.');
  if (isIOS() && !standalone()) return openSheet({ type: 'install' });
  if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return toast('This browser can’t show alerts.');
  if (!CFG.VAPID_PUBLIC_KEY) return toast('Alerts aren’t set up yet.');
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') return toast('Alerts are blocked — allow them for this app in your phone’s settings.');
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(CFG.VAPID_PUBLIC_KEY) });
    await api.savePush(sub.toJSON());
    ls.set('omega_push', true);
    toast(isStaff() ? 'Order alerts are on for this phone 🔔' : 'Alerts are on 🔔');
    renderMain(); if (S.sheet) renderSheet();
  } catch (e) { console.error(e); toast('Couldn’t turn on alerts: ' + e.message); }
}
async function resavePush() {
  if (!pushOn() || api.demo || !('serviceWorker' in navigator)) return;
  try { const reg = await navigator.serviceWorker.ready; const sub = await reg.pushManager.getSubscription(); if (sub) await api.savePush(sub.toJSON()); } catch (e) {}
}
let wakeLock = null;
async function toggleWake() {
  try {

    else { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; renderMain(); }); toast('Screen will stay on while this is open'); }

function pickupSlots() {
  const s = ST(), lead = (+s.pickup_lead_min || 15) * 60000;
  for (let off = 0; off < 8; off++) {
    const day = new Date(); day.setDate(day.getDate() + off);
    if (!(s.days_open || []).includes(day.getDay())) continue;
    const open = hm2date(s.open_time, day), close = hm2date(s.close_time, day);
    let t = new Date(Math.max(+open, Date.now() + lead)); t.setSeconds(0, 0);
    const m = t.getMinutes() % 15; if (m) t = new Date(+t + (15 - m) * 60000);
    const list = [];
    while (t < close) { list.push(new Date(t)); t = new Date(+t + 15 * 60000); }
    if (list.length) return { label: off === 0 ? 'Today' : off === 1 ? 'Tomorrow' : day.toLocaleDateString([], { weekday: 'long' }), list };
  }
  return { label: '', list: [] };
}

async function resolvePhoto(fd) {
  const f = fd.get('photo');
  if (f && f.size) return await api.uploadPhoto(f);
  if (fd.get('photo_remove')) return null;
  return fd.get('photo_current') || null;
}
const findOrder = id => S.allOrders.find(o => o.id === id) || S.myOrders.find(o => o.id === id);

function closeSheet() { S.sheet = null; renderSheet(); }
function renderSheet() {
  const root = document.getElementById('sheet');
  if (!S.sheet) { root.innerHTML = ''; document.body.classList.remove('lock'); return; }
  root.innerHTML = `<div class="backdrop" data-a="close"></div><div class="sheet" role="dialog" aria-modal="true"><button class="x" data-a="close" aria-label="Close">×</button>${SHEETS[S.sheet.type](S.sheet)}</div>`;

function addToCart(line) {
  const key = [line.k, line.id, line.option || '', line.note || ''].join('|');
  const ex = S.cart.find(c => c.key === key);
  if (ex) ex.qty += line.qty; else S.cart.push(Object.assign({ key }, line));
  saveCart();
  toast(`Added ${line.qty > 1 ? line.qty + '× ' : ''}${line.name}${line.option ? ' (' + line.option + ')' : ''}`, { label: 'View order', a: 'gotoCart' });
  renderMain();
}
function lineOut(c) { return { name: c.name + (c.option ? ` (${c.option})` : '') + (c.k === 'deal' ? ' — DEAL' : ''), qty: c.qty, price: isNum(c.price) ? c.price : null, note: c.note || null }; }
function dropEndedDeals() {
  const live = activeDeals().map(d => d.id), before = S.cart.length;
  S.cart = S.cart.filter(c => c.k !== 'deal' || live.includes(c.id));
  if (S.cart.length !== before) { saveCart(); renderMain(); throw new Error('A deal in your order just ended or sold out, so it was removed. Check your order and send again.'); }
}

/* ---------------- actions (taps) ---------------- */
let taps = 0, tapT;
async function move(table, list, id, dir) {
  const i = list.findIndex(x => x.id === id), j = i + dir;
  if (i < 0 || j < 0 || j >= list.length) return;
  const arr = list.slice(); [arr[i], arr[j]] = [arr[j], arr[i]];
  await Promise.all(arr.map((x, k) => (x.sort !== k * 10 ? api.save(table, { id: x.id, sort: k * 10 }) : null)));
  await refreshPublic();
}
const A = {
  tab(el) { S.tab = el.dataset.v; renderMain(); window.scrollTo(0, 0); if (S.tab === 'ideas' || S.tab === 'owner') refreshUser(); },
  gotoCart() { S.tab = 'order'; S.orderMode = 'pickup'; renderMain(); window.scrollTo(0, 0); },
  gotoOrders() { closeSheet(); S.tab = 'order'; renderMain(); const el = document.getElementById('myorders'); if (el) el.scrollIntoView(); },
  logo() {
    taps++; clearTimeout(tapT);
    if (taps >= 5) { taps = 0; if (isStaff()) { S.tab = 'owner'; renderMain(); } else openSheet({ type: 'staff', mode: S.staffOpen ? 'up' : 'in' }); return; }
    tapT = setTimeout(() => { if (taps === 1) { S.tab = 'home'; renderMain(); window.scrollTo({ top: 0, behavior: 'smooth' }); } taps = 0; }, 500);
  },
  auth() { openSheet({ type: 'auth', mode: ls.get('omega_had_account', false) ? 'in' : 'up' }); },
  authMode(el) { S.sheet.mode = el.dataset.v; renderSheet(); },
  staffSetup() { openSheet({ type: 'staff', mode: 'up' }); },
  staffMode(el) { S.sheet.mode = el.dataset.v; renderSheet(); },
  account() { openSheet({ type: 'account' }); },
  notifs() { ls.set('omega_seen', new Date().toISOString()); openSheet({ type: 'notifs' }); renderMain(); },
  push() { enablePush(); },
  close() { closeSheet(); },
  reload() { location.reload(); },
  async demoReset() { if (confirm('Reset the preview data on this device?')) { ls.del('omega_demo_v1'); ls.del('omega_cart'); location.reload(); } },
  add(el, e) {
    e.stopPropagation();
    const k = el.dataset.k, id = +el.dataset.id, r = findRef(k, id); if (!r) return;
    if (k === 'item' && r.options && r.options.length) return openSheet({ type: 'item', id });
    addToCart({ k, id, name: r.name || r.title, option: '', price: isNum(r.price) ? +r.price : null, qty: 1 });
  },
  item(el) { openSheet({ type: 'item', id: +el.dataset.id }); },
  sqty(el) { const inp = el.closest('form').querySelector('[name=qty]'); inp.value = Math.max(1, Math.min(50, (+inp.value || 1) + (+el.dataset.d))); },
  cq(el) {
    const c = S.cart.find(x => x.key === el.dataset.key); if (!c) return;
    c.qty += +el.dataset.d; if (c.qty <= 0) S.cart = S.cart.filter(x => x !== c);
    saveCart(); renderMain();
  },
  mode(el) { S.orderMode = el.dataset.v; renderMain(); },
  catering() { S.tab = 'order'; S.orderMode = 'catering'; renderMain(); window.scrollTo(0, 0); },
  jump(el) { const t = document.getElementById('cat-' + el.dataset.id); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); },
  async cancelOrder(el) {
    if (!confirm('Cancel this order?')) return;
    try { await api.setOrder(+el.dataset.id, { status: 'cancelled' }); await refreshUser(); toast('Order cancelled'); } catch (e) { toast(e.message); }
  },
  async vote(el) {
    if (!S.user) return A.auth();
    const i = S.ideas.find(x => x.id === +el.dataset.id); if (!i) return;
    i.voted = !i.voted; i.votes += i.voted ? 1 : -1; renderMain();
    try { await api.vote(i.id, i.voted); } catch (e) { toast(e.message); }
    refreshUser();
  },
  otab(el) { S.ownerTab = el.dataset.v; renderMain(); window.scrollTo(0, 0); if (S.ownerTab === 'ideas' || S.ownerTab === 'settings') refreshUser(); },
  async ost(el) {
    el.disabled = true;
    try { await api.setOrder(+el.dataset.id, { status: el.dataset.v }); await refreshUser(); toast({ accepted: 'Accepted — customer notified', ready: 'Marked ready — customer notified', done: 'Done' }[el.dataset.v] || 'Updated'); }
    catch (e) { toast(e.message); el.disabled = false; }
  },
  decline(el) { openSheet({ type: 'decline', id: +el.dataset.id }); },
  wake() { toggleWake(); },
  dealForm(el) { openSheet({ type: 'deal', id: el.dataset.id ? +el.dataset.id : null }); },
  async dealEnd(el) { try { await api.save('deals', { id: +el.dataset.id, active: false }); await refreshPublic(); toast('Deal ended'); } catch (e) { toast(e.message); } },
  async dealDec(el) {
    const d = S.data.deals.find(x => x.id === +el.dataset.id); if (!d) return;
    try { await api.save('deals', { id: d.id, qty_left: Math.max(0, d.qty_left - 1) }); await refreshPublic(); } catch (e) { toast(e.message); }
  },
  dealAgain(el) {
    const d = S.data.deals.find(x => x.id === +el.dataset.id); if (!d) return;
    openSheet({ type: 'deal', from: { title: d.title, price: d.price, was_price: d.was_price, description: d.description, photo_url: d.photo_url } });
  },
  async dealDel(el) {
    if (!confirm('Delete this deal?')) return;
    try { await api.remove('deals', +el.dataset.id); closeSheet(); await refreshPublic(); } catch (e) { toast(e.message); }
  },
  specialForm(el) { openSheet({ type: 'special', id: el.dataset.id ? +el.dataset.id : null }); },
  async specialDel(el) { if (!confirm('Delete this special?')) return; try { await api.remove('specials', +el.dataset.id); closeSheet(); await refreshPublic(); } catch (e) { toast(e.message); } },
  itemForm(el) { openSheet({ type: 'itemEdit', id: el.dataset.id ? +el.dataset.id : null }); },
  async itemDel(el) { if (!confirm('Delete this item from the menu?')) return; try { await api.remove('menu_items', +el.dataset.id); closeSheet(); await refreshPublic(); } catch (e) { toast(e.message); } },
  async avail(el) {
    const i = S.data.items.find(x => x.id === +el.dataset.id); if (!i) return;
    i.available = !i.available; renderMain();
    try { await api.save('menu_items', { id: i.id, available: i.available }); } catch (e) { toast(e.message); }
    refreshPublic();
  },
  async itemMove(el) {
    const i = S.data.items.find(x => x.id === +el.dataset.id); if (!i) return;
    const g = x => (S.data.categories.some(c => c.id === x.category_id) ? x.category_id : 0);
    const list = S.data.items.filter(x => g(x) === g(i));
    try { await move('menu_items', list, i.id, +el.dataset.d); } catch (e) { toast(e.message); }
  },
  catForm(el) { openSheet({ type: 'cat', id: el.dataset.id ? +el.dataset.id : null }); },
  async catMove(el) { try { await move('categories', S.data.categories, +el.dataset.id, +el.dataset.d); } catch (e) { toast(e.message); } },
  async catDel(el) { if (!confirm('Delete this category? Its items stay on the menu under “More”.')) return; try { await api.remove('categories', +el.dataset.id); closeSheet(); await refreshPublic(); } catch (e) { toast(e.message); } },
  async ideaSt(el) { try { await api.setIdea(+el.dataset.id, { status: el.dataset.v }); await refreshUser(); } catch (e) { toast(e.message); } },
  async ideaDel(el) { if (!confirm('Delete this idea?')) return; try { await api.delIdea(+el.dataset.id); await refreshUser(); } catch (e) { toast(e.message); } },
  ideaSpecial(el) { const i = S.ideas.find(x => x.id === +el.dataset.id); if (i) openSheet({ type: 'special', title: i.text, ideaId: i.id }); },
  async rmStaff(el) {
    if (!confirm('Remove owner access for ' + el.dataset.v + '?')) return;
    try { await api.removeStaffEmail(el.dataset.v); await Promise.all([refreshUser(), refreshStaffOpen()]); toast('Removed'); } catch (e) { toast(e.message); }
  },
  qr() { S.qr = true; renderMain(); window.scrollTo(0, 0); },
  qrClose() { S.qr = false; if (location.hash) history.replaceState(null, '', location.pathname + location.search); renderMain(); },
  print() { window.print(); },
  async signout() {
    if (!confirm('Sign out on this phone?')) return;
    closeSheet(); await api.signOut(); await setUser(null, true); S.tab = 'home'; renderMain(); toast('Signed out');
  }
};

/* ---------------- forms ---------------- */
const F = {
  async auth(fd, form) {
    const d = digits(fd.get('phone'));
    if (d.length !== 10) throw new Error('Enter a 10-digit mobile number.');
    if (form.dataset.mode === 'up') await api.signUpPhone(String(fd.get('name')).trim(), d, fd.get('pw'));
    else await api.signIn(phoneEmail(d), fd.get('pw'), 'customer');
    ls.set('omega_had_account', true);
    closeSheet(); await setUser(await api.getSession());
    toast(S.cart.length && S.tab === 'order' ? 'You’re in — you can send your order now.' : 'You’re signed in 👋');
  },
  async staff(fd, form) {
    const email = String(fd.get('email')).trim().toLowerCase(), pw = fd.get('pw');
    if (form.dataset.mode === 'up') {
      const st = await api.staffEmailStatus(email);
      if (st === 'not_allowed') throw new Error('That email isn’t on the owner list.');
      if (st === 'claimed') throw new Error('That email is already set up — sign in instead.');
      await api.signUpStaff(email, pw, String(fd.get('name')).trim());
    } else await api.signIn(email, pw, 'staff');
    closeSheet();
    if (location.hash === '#staff') history.replaceState(null, '', location.pathname + location.search);
    await setUser(await api.getSession());
    if (isStaff()) { S.tab = 'owner'; S.ownerTab = 'orders'; renderMain(); window.scrollTo(0, 0); toast('Welcome — you have owner access'); }
    else toast('Signed in, but this login doesn’t have owner access.');
  },
  async name(fd) { await api.updateName(S.user.id, String(fd.get('name')).trim()); S.profile = await api.profile(S.user.id); closeSheet(); renderMain(); toast('Saved'); },
  async addItem(fd) {
    const r = findRef('item', S.sheet.id); const o = (r.options || [])[+fd.get('opt') || 0];
    addToCart({ k: 'item', id: r.id, name: r.name, option: o ? o.label : '', price: o ? (isNum(o.price) ? +o.price : null) : (isNum(r.price) ? +r.price : null), qty: Math.max(1, +fd.get('qty') || 1), note: String(fd.get('note') || '').trim() });
    closeSheet();
  },
  async pickup(fd) {
    if (!S.user) return A.auth();
    if (!S.cart.length) throw new Error('Your order is empty.');
    dropEndedDeals();
    const { total } = cartTotal();
    await api.placeOrder({ kind: 'pickup', name: String(fd.get('name')).trim(), phone: (S.profile && S.profile.phone) || null, items: S.cart.map(lineOut),
      est_total: Math.round(total * 100) / 100, pickup_at: fd.get('when'), notes: String(fd.get('notes') || '').trim() || null });
    S.cart = []; saveCart(); await refreshUser();
    toast('Order sent! We’ll let you know when it’s accepted.', pushOn() || isStaff() ? null : { label: 'Get alerts', a: 'push' });
    const el = document.getElementById('myorders'); if (el) el.scrollIntoView({ behavior: 'smooth' });
  },
  async catering(fd) {
    if (!S.user) return A.auth();
    const when = new Date(fd.get('date') + 'T' + fd.get('time'));
    if (isNaN(when) || when < new Date()) throw new Error('Pick a date and time in the future.');
    const hc = toInt(fd.get('headcount')); if (!hc || hc < 1) throw new Error('How many people? Enter a number.');
    const use = !!fd.get('usecart') && S.cart.length;
    if (use) dropEndedDeals();
    const notes = String(fd.get('notes') || '').trim();
    if (!use && !notes) throw new Error('Tell us what you’d like (or add items from the menu).');
    await api.placeOrder({ kind: 'catering', name: String(fd.get('name')).trim(), phone: (S.profile && S.profile.phone) || null,
      company: String(fd.get('company') || '').trim() || null, location: String(fd.get('location') || '').trim() || null,
      delivery: fd.get('delivery') === '1', headcount: hc, pickup_at: when.toISOString(), notes: notes || null,
      items: use ? S.cart.map(lineOut) : [], est_total: use ? Math.round(cartTotal().total * 100) / 100 : 0 });
    if (use) { S.cart = []; saveCart(); }
    await refreshUser();
    toast('Catering request sent! We’ll confirm with a notification.', pushOn() || isStaff() ? null : { label: 'Get alerts', a: 'push' });
    const el = document.getElementById('myorders'); if (el) el.scrollIntoView({ behavior: 'smooth' });
  },
  async idea(fd, form) {
    const text = String(fd.get('text') || '').trim(); if (text.length < 3) throw new Error('Write a little more.');
    await api.addIdea(text); form.reset(); await refreshUser(); toast('Thanks! Your idea is up for votes.');
  },
  async decline(fd) {
    await api.setOrder(S.sheet.id, { status: 'declined', staff_note: String(fd.get('note') || '').trim() || null });
    closeSheet(); await refreshUser(); toast('Declined — customer notified');
  },
  async deal(fd) {
    const sh = S.sheet, ends = hm2date(fd.get('ends'));
    if (ends <= new Date()) throw new Error('Pick an end time later than now.');
    const price = toNum(fd.get('price')); if (price === null) throw new Error('Enter the deal price.');
    const row = { title: String(fd.get('title')).trim(), description: String(fd.get('description') || '').trim() || null, price, was_price: toNum(fd.get('was_price')),
      qty_left: toInt(fd.get('qty_left')), ends_at: ends.toISOString(), photo_url: await resolvePhoto(fd) };
    if (fd.get('from')) row.menu_item_id = +fd.get('from');
    if (sh.id) row.id = sh.id; else { row.active = true; row.notify = !!fd.get('notify'); }
    await api.save('deals', row);
    if (!sh.id && row.notify) api.kick();
    closeSheet(); await refreshPublic(); refreshUser();
    toast(sh.id ? 'Deal saved' : row.notify ? 'Deal posted — customers alerted 🔥' : 'Deal posted 🔥');
  },
  async special(fd) {
    const sh = S.sheet;
    const row = { title: String(fd.get('title')).trim(), description: String(fd.get('description') || '').trim() || null, price: toNum(fd.get('price')),
      days: fd.getAll('days').map(Number), active: !!fd.get('active'), photo_url: await resolvePhoto(fd) };
    if (sh.id) row.id = sh.id; else row.sort = S.data.specials.length * 10;
    await api.save('specials', row);
    if (sh.ideaId) await api.setIdea(sh.ideaId, { status: 'made' }).catch(() => {});
    closeSheet(); await refreshPublic(); if (sh.ideaId) refreshUser();
    toast(sh.id ? 'Special saved' : 'Special added');
  },
  async item(fd) {
    const sh = S.sheet;
    const row = { name: String(fd.get('name')).trim(), category_id: fd.get('category_id') ? +fd.get('category_id') : null, price: toNum(fd.get('price')),
      options: parseOptions(fd.get('options')), description: String(fd.get('description') || '').trim() || null,
      available: !!fd.get('available'), hidden: !!fd.get('hidden'), photo_url: await resolvePhoto(fd) };
    if (row.price === null && !row.options.length) throw new Error('Add a price (or sizes with prices).');
    if (sh.id) row.id = sh.id; else row.sort = (S.data.items.reduce((m, x) => Math.max(m, x.sort || 0), 0)) + 10;
    await api.save('menu_items', row);
    closeSheet(); await refreshPublic(); toast(sh.id ? 'Item saved' : 'Item added');
  },
  async cat(fd) {
    const sh = S.sheet, row = { name: String(fd.get('name')).trim() };
    if (sh.id) row.id = sh.id; else row.sort = (S.data.categories.reduce((m, x) => Math.max(m, x.sort || 0), 0)) + 10;
    await api.save('categories', row); closeSheet(); await refreshPublic(); toast('Category saved');
  },
  async settings(fd) {
    const s = Object.assign({}, ST(), {
      announcement: String(fd.get('announcement') || '').trim(), blowout_time: fd.get('blowout_time') || DEF.blowout_time,
      open_time: fd.get('open_time') || DEF.open_time, close_time: fd.get('close_time') || DEF.close_time,
      days_open: fd.getAll('days_open').map(Number), hours: String(fd.get('hours') || '').trim(), phone: String(fd.get('phone') || '').trim(),
      address: String(fd.get('address') || '').trim(), ordering_open: !!fd.get('ordering_open'), catering_open: !!fd.get('catering_open'),
      catering_note: String(fd.get('catering_note') || '').trim(), pickup_lead_min: toInt(fd.get('pickup_lead_min')) || 15
    });
    await api.saveSettings(s); await refreshPublic(); toast('Settings saved');
  },
  async staffAdd(fd, form) {
    const email = String(fd.get('email')).trim().toLowerCase();
    await api.addStaffEmail(email); form.reset(); await Promise.all([refreshUser(), refreshStaffOpen()]);
    toast('Added — they can now create their owner login');
  }
};

/* ---------------- change handlers ---------------- */
const C = {
  async spActive(el) { try { await api.save('specials', { id: +el.dataset.id, active: el.checked }); await refreshPublic(); } catch (e) { toast(e.message); } },
  dealFrom(el) {
    const i = S.data.items.find(x => x.id === +el.value), f = el.form; if (!i) return;
    f.title.value = i.name;
    const p = isNum(i.price) ? i.price : (i.options && i.options[0] ? i.options[0].price : null);
    if (isNum(p)) f.was_price.value = (+p).toFixed(2);
    if (i.photo_url) { f.photo_current.value = i.photo_url; const img = f.querySelector('.ph img'); img.src = i.photo_url; img.hidden = false; }
  }
};

/* ---------------- events ---------------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const fn = A[el.dataset.a]; if (!fn) return;
  if (el.tagName === 'A') e.preventDefault();
  if (el.closest('#toast')) document.getElementById('toast').className = 'toast';
  fn(el, e);
});
document.addEventListener('submit', async e => {
  const form = e.target.closest('form[data-f]'); if (!form) return;
  e.preventDefault();
  const fn = F[form.dataset.f]; if (!fn) return;
  const btn = form.querySelector('button:not([type=button])'), err = form.querySelector('.err');
  const label = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'One sec…'; }
  if (err) err.hidden = true;
  try { await fn(new FormData(form), form); }
  catch (x) { console.error(x); if (err && form.isConnected) { err.textContent = x.message || 'Something went wrong.'; err.hidden = false; } else toast(x.message || 'Something went wrong.'); }
  finally { if (btn && form.isConnected) { btn.disabled = false; btn.textContent = label; } }
});
document.addEventListener('change', e => { const el = e.target.closest('[data-ch]'); if (el && C[el.dataset.ch]) C[el.dataset.ch](el, e); });
document.addEventListener('change', e => {
  if (e.target.name !== 'photo' || !e.target.files || !e.target.files[0]) return;
  const img = e.target.closest('.ph').querySelector('img'); img.src = URL.createObjectURL(e.target.files[0]); img.hidden = false;
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sheet) closeSheet(); });
function route() {
  if (location.hash === '#staff') openSheet({ type: 'staff', mode: S.staffOpen ? 'up' : 'in' });
  else if (location.hash === '#qr' && isStaff()) { S.qr = true; renderMain(); }
}
window.addEventListener('hashchange', route);

/* ---------------- boot ---------------- */
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('load')); document.head.appendChild(s); }); }
async function boot() {
  if (CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY) {
    try { await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'); }
    catch (e) { S.error = 'Can’t reach Omega Deli right now. Check your connection and try again.'; renderMain(); return; }
    api = supaApi(window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'omega-auth' } }));
  } else api = demoApi();
  if (!ls.get('omega_seen', null)) ls.set('omega_seen', new Date().toISOString());
  api.onAuth(u => setUser(u));
  const [u] = await Promise.all([api.getSession().catch(() => null), api.loadPublic().then(d => { S.data = d; }).catch(e => console.warn(e))]);
  await setUser(u, true);
  S.loaded = true; renderMain(); route();
  api.live(onLive);
  let tick = 0;
  setInterval(() => { if (document.hidden) return; tick++; if (isStaff() || tick % 3 === 0) refreshUser(); if (tick % 3 === 0) refreshPublic(); }, 20000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { refreshPublic(); refreshUser(); } });
  if ('serviceWorker' in navigator && !api.demo) navigator.serviceWorker.register('sw.js').catch(() => {});
}
boot();
})();
